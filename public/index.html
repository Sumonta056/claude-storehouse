<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude Storehouse</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div class="app">
      <aside class="side">
        <div class="brand">
          <svg
            width="28"
            height="28"
            viewBox="0 0 24 24"
            fill="none"
            stroke="var(--accent)"
            stroke-width="2.6"
            stroke-linecap="round"
            aria-hidden="true"
          >
            <path
              d="M12 2.5V9M12 15v6.5M2.5 12H9M15 12h6.5M18.4 5.6l-4.2 4.2M5.6 5.6l4.2 4.2M18.4 18.4l-4.2-4.2M5.6 18.4l4.2-4.2"
            /></svg
          ><span>Storehouse</span>
        </div>
        <nav class="nav" id="nav" aria-label="Pages">
          <button type="button" data-p="dash">
            <svg
              class="ic"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" /></svg
            ><span class="lbl">Dashboard</span>
          </button>
          <button type="button" data-p="fav">
            <svg
              class="ic"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3l-5.5 2.9 1-6.2L3 9.6l6.2-.9z" /></svg
            ><span class="lbl">Favorites</span><b id="n-fav">0</b>
          </button>
          <button type="button" data-p="dups">
            <svg
              class="ic"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M8 8h11v11H8zM5 16V5h11" /></svg
            ><span class="lbl">Duplicates</span><b id="n-dups">0</b>
          </button>
          <button type="button" data-p="doctor">
            <svg
              class="ic"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 12h4l2-5 4 10 2-5h6" /></svg
            ><span class="lbl">Doctor</span><b id="n-doctor">0</b>
          </button>
          <button type="button" data-p="context">
            <svg
              class="ic"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 20h16M6 16V10M10 16V4M14 16v-8M18 16v-4" /></svg
            ><span class="lbl">Context</span><b id="n-context">0</b>
          </button>
          <div class="sep">Catalog</div>
          <button type="button" data-p="skills">
            <svg
              class="ic"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3" /></svg
            ><span class="lbl">Skills</span><b id="n-skills">0</b>
          </button>
          <button type="button" data-p="agents">
            <svg
              class="ic"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M12 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM4 21c0-4 3.6-7 8-7s8 3 8 7" /></svg
            ><span class="lbl">Agents</span><b id="n-agents">0</b>
          </button>
          <button type="button" data-p="plugins">
            <svg
              class="ic"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 2v6M15 2v6M6 8h12v4a6 6 0 0 1-12 0zM12 18v4" /></svg
            ><span class="lbl">Plugins</span><b id="n-plugins">0</b>
          </button>
          <button type="button" data-p="mods">
            <svg
              class="ic"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 7h4a2 2 0 1 1 4 0h4v4a2 2 0 1 1 0 4v4h-4a2 2 0 1 0-4 0H4v-4a2 2 0 1 0 0-4z" /></svg
            ><span class="lbl">Mods</span><b id="n-mods">0</b>
          </button>
          <button type="button" data-p="hooks">
            <svg
              class="ic"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M10 3v10a4 4 0 0 0 8 0v-2M7 6l3-3 3 3" /></svg
            ><span class="lbl">Hooks</span><b id="n-hooks">0</b>
          </button>
          <button type="button" data-p="mcp">
            <svg
              class="ic"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01" /></svg
            ><span class="lbl">MCP servers</span><b id="n-mcp">0</b>
          </button>
          <div class="sep">Config</div>
          <button type="button" data-p="settings">
            <svg
              class="ic"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1M15 4v4M9 10v4M17 16v4" /></svg
            ><span class="lbl">Settings</span>
          </button>
          <button type="button" data-p="claudemd">
            <svg
              class="ic"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M6 2h9l5 5v15H6zM14 2v6h6" /></svg
            ><span class="lbl">CLAUDE.md</span>
          </button>
          <button type="button" data-p="activity">
            <svg
              class="ic"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 14 4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg
            ><span class="lbl">Activity</span><b id="n-activity"></b>
          </button>
        </nav>
        <footer class="side-foot">
          <span>Made by Sumonta</span>
          <a
            href="https://github.com/Sumonta056"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
            title="GitHub"
            ><svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2 2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2 4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0C6.5 2.8 5.4 3.1 5.4 3.1a4.2 4.2 0 0 0-.1 3.2A4.6 4.6 0 0 0 4 9.5c0 4.6 2.7 5.7 5.5 6-.6.6-.6 1.2-.5 2V21"
              /></svg
          ></a>
          <a
            href="https://sumonta056.vercel.app/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Portfolio"
            title="Portfolio"
            ><svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"
              /></svg
          ></a>
        </footer>
      </aside>

      <main class="main">
        <div class="top">
          <h1 id="title" tabindex="-1">Dashboard</h1>
          <div class="controls">
            <input
              class="search"
              id="q"
              type="search"
              placeholder="Search name or description ( / )"
              aria-label="Search"
            />
            <div class="scope" id="scope" role="group" aria-label="Scope">
              <button type="button" data-s="all" aria-pressed="true">All</button>
              <button type="button" data-s="global" aria-pressed="false">Global</button>
              <button type="button" data-s="project" aria-pressed="false">Project</button>
            </div>
          </div>
        </div>
        <div class="ctx" id="ctx">Loading your Claude Code setup…</div>
        <div class="banner" id="banner" hidden>
          <span>Claude Code applies this at the next session.</span>
          <button type="button" class="btn" id="banner-x" aria-label="Dismiss">Dismiss</button>
        </div>
        <div class="warn" id="load-error" hidden></div>

        <section class="page" id="p-dash"></section>
        <section class="page" id="p-fav"></section>
        <section class="page" id="p-dups"></section>
        <section class="page" id="p-doctor"></section>
        <section class="page" id="p-context"></section>
        <section class="page" id="p-skills"></section>
        <section class="page" id="p-agents"></section>
        <section class="page" id="p-plugins"></section>
        <section class="page" id="p-mods"></section>
        <section class="page" id="p-hooks"></section>
        <section class="page" id="p-mcp"></section>
        <section class="page" id="p-settings"></section>
        <section class="page" id="p-claudemd"></section>
        <section class="page" id="p-activity" hidden>
          <p class="note">Switches, saves, and stars from this session. Undo reverses one change.</p>
          <ul class="act" id="act">
            <li class="act-empty"><b>No changes yet</b></li>
          </ul>
        </section>
      </main>
    </div>

    <div class="scrim" id="dr-scrim" hidden></div>
    <aside class="drawer" id="dr" role="dialog" aria-modal="true" aria-labelledby="dr-name" aria-hidden="true">
      <div class="dr-top">
        <div class="dh">
          <div class="kicon" id="dr-icon" aria-hidden="true"></div>
          <div class="dh-name">
            <h2 class="dr-title" id="dr-name"></h2>
            <p class="dr-meta" id="dr-meta"></p>
          </div>
          <div class="dh-tools" id="dr-tools"></div>
          <button type="button" class="icon-btn" id="dr-close" aria-label="Close">
            <svg
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              aria-hidden="true"
            >
              <path d="M6 6l12 12M18 6 6 18" />
            </svg>
          </button>
        </div>
        <div class="facts" id="dr-facts"></div>
      </div>
      <div class="dr-body" id="dr-body"></div>
      <div class="dr-bar" id="dr-bar"></div>
    </aside>

    <div class="modal" id="cf" hidden>
      <div class="box" role="alertdialog" aria-modal="true" aria-labelledby="cf-title" aria-describedby="cf-msg">
        <h3 id="cf-title"></h3>
        <p id="cf-msg"></p>
        <div class="cf-cmd" id="cf-cmd-box" hidden>
          <span>Storehouse runs this command:</span><code id="cf-cmd"></code>
        </div>
        <div class="row end">
          <button type="button" class="btn" id="cf-no">Cancel</button>
          <button type="button" class="btn" id="cf-yes">OK</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
