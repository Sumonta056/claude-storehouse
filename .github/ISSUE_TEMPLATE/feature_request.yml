name: Feature request
description: Suggest a new feature or a change
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that the dashboard does not let you do today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skills
        - Agents
        - Plugins
        - Hooks
        - MCP
        - Settings
        - CLAUDE.md
        - Favorites
        - CLI
        - Other
