name: Bug report
description: Something in the dashboard does not work as expected
title: 'bug: '
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `npx claude-storehouse` in ...
        2. Open the Skills page
        3. Switch off ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Skills
        - Agents
        - Plugins
        - Hooks
        - MCP
        - Settings
        - CLAUDE.md
        - Favorites
        - CLI
        - Other
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Global (~/.claude)
        - Project (./.claude)
        - Both
  - type: input
    id: version
    attributes:
      label: claude-storehouse version
      description: Output of `npx claude-storehouse --version`
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS, Node, and Claude Code version
      placeholder: macOS 15, Node 22.11, Claude Code 2.x
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or error
      description: Remove tokens, secrets, and private paths first.
      render: shell
  - type: checkboxes
    id: config
    attributes:
      label: Config files
      options:
        - label: A config file changed in a way I did not expect. I checked `~/.claude/backups/storehouse/` for the backup.
